name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  onekey-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The OneKey monorepo needs ~8 GB of scratch space (offline cache,
      # node_modules, rspack output); free the preinstalled SDKs first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@v31

      - name: Build onekey-wallet
        run: nix build -L .#onekey-wallet
