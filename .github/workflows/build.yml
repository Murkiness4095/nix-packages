name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v4

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: nix-packages
          skipPush: true

      - name: Build public packages
        shell: bash
        run: |
          set -euo pipefail
          nix eval --json ".#packages.$SYSTEM" --apply builtins.attrNames |
            jq -r '.[] | select(. != "tern")' > "$RUNNER_TEMP/package-names"
          : > "$RUNNER_TEMP/store-paths"
          failed=0
          while IFS= read -r package; do
            if ! nix build -L --no-link --print-out-paths ".#packages.$SYSTEM.$package" \
                >> "$RUNNER_TEMP/store-paths"; then
              failed=1
            fi
          done < "$RUNNER_TEMP/package-names"
          exit "$failed"

      - name: Publish successful builds to Cachix
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/store-paths" || exit 0
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN Actions secret for the nix-packages cache."
            exit 1
          fi
          cachix push nix-packages < "$RUNNER_TEMP/store-paths"
